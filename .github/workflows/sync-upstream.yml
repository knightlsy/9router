name: Sync upstream

on:
  schedule:
    # 每天 4 次（UTC 0/6/12/18 点）—— 即北京时间 8/14/20/次日2 点
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    name: Merge upstream into fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Merge upstream
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git remote add upstream https://github.com/decolua/9router.git 2>/dev/null || \
            git remote set-url upstream https://github.com/decolua/9router.git
          git fetch --no-tags upstream master

          if git merge-base --is-ancestor "upstream/master" HEAD; then
            echo "::notice::Already up to date — nothing to sync"
            exit 0
          fi

          echo "::notice::Upstream has new commits, merging…"
          # ndjson: 不要用 `git log ... | head -20`。
          # 脚本开了 `set -euo pipefail`，head 读够 20 行就关闭管道，
          # git log 收到 SIGPIPE（退出码 141），pipefail 判定整条管道失败，
          # set -e 直接中止 —— merge 一步都跑不到。
          # 用 git 自己的 -20 限制输出，不产生管道。
          git --no-pager log --oneline -20 HEAD.."upstream/master"

          if ! git merge --no-edit "upstream/master"; then
            git merge --abort || true
            echo "::error::Merge conflict — fork has local commits that clash with upstream. Resolve manually."
            exit 1
          fi

          git push origin master
          echo "::notice::Synced to $(git rev-parse --short HEAD)"
